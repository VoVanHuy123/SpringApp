<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <th:object th:replace="base :: bt"></th:object>
    <title>Home Page</title>
</head>
<body>
    <div th:replace="base :: menu"></div>
    <div class = "container">
        <form th:action="@{/}">
            <div class="mb-3 mt-3">
                <input class="form-control" placeholder="Tìm kiếm theo tên" name="kw">
            </div>
            <div class="row mb-3 mt-3">
                <div class="col-6">
                    <input class="form-control" placeholder="lớn hơn" name="fromPrice">
                </div>
                <div class="col-6">
                    <input class="form-control" placeholder="nhỏ hơn" name="toPrice">
                </div>

            </div>
            <div class=" mb-3 mt-3">
                <button class="btn btn-info">Tìm kiếm</button>
            </div>
        </form>
        <a th:href="@{/products}">Thêm sản phẩm</a>
        <table class="table table-striped">
            <thead>
                <tr>
                    <th></th>
                    <th>ID</th>
                    <th>Tên sản phẩm</th>
                    <th>Giá bán</th>
                    <th></th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="p : ${products}">
                    <td>
                        <img th:src ="${p.image}" width="200" class="rounded"/>
                    </td>
                    <td th:text="${p.id}"></td>
                    <td th:text="${p.name}">john@example.com</td>
                    <td th:text="${p.price} + ' VNĐ'"></td>
                    <td>
                        <a href="#" class="btn btn-success">Cập nhật</a>
                        <button class="btn btn-danger">Xóa</button>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
    <div th:replace="base :: footer"></div>
</body>

</html>
